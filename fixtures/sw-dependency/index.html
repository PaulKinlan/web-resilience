<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depot — service-worker dependency fixture</title>
  <link rel="stylesheet" href="/sw-dependency/styles.css">
</head>
<body>
  <h1>Depot</h1>
  <p>Stock levels, served from the edge.</p>

  <!--
    SEEDED ISSUE: this list is populated from /sw-dependency/api/stock, an
    endpoint that ONLY the service worker can answer. The origin server has no
    such route. The app treats the service worker as permanent infrastructure,
    so the moment it stops, is unregistered, or is bypassed for a first-time
    visitor, the page has no data and says nothing about why.
  -->
  <ul id="stock"><li id="stock-pending">Checking stock…</li></ul>

  <p id="status" role="status">Starting.</p>

  <script src="/sw-dependency/app.js" defer></script>
</body>
</html>
